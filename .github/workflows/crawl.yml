name: Crawl addons

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: ofxaddons-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Crawl Github for addons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php crawl.php

      # First-pass check for script/prompt-injection attempts in a
      # crawled repo's name/description - read-only, never blocks the
      # crawl (see scripts/scan_threats.php for why). The consuming site
      # runs the same check again independently when it applies this
      # snapshot, which is where an actual ban/quarantine happens.
      - name: Scan for malicious repo content
        run: php scripts/scan_threats.php data/addons.json

      # ~4MB of JSON gzips down to ~400KB - the .gz is the only one
      # published (see below); ofx_fetch_latest_crawl_snapshot() on the
      # site only ever fetches the .gz too, so there's no reason to
      # publish the ~10x-larger plain .json as well.
      - name: Compress the snapshot
        run: gzip -9 data/addons.json

      - name: Publish a dated release with the snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="data-$(date -u +%Y-%m-%d)"
          notes="Automated crawl - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # data/banned.json is written by ofx_fetch_banned_full_names() in
          # crawl.php (the banned list this same run actually filtered
          # against) - only skipped if the site couldn't be reached for it,
          # so don't hard-fail the whole release on a missing file.
          assets=(data/addons.json.gz)
          if [ -f data/banned.json ]; then
            assets+=(data/banned.json)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Addon data $(date -u +%Y-%m-%d)" \
              --notes "$notes" \
              --target main
          fi

      # /releases/latest always resolves to the most recent non-prerelease
      # release, so the site can always fetch
      # /releases/latest/download/addons.json without knowing today's tag.
      - name: Notify the site to sync
        if: ${{ vars.SYNC_WEBHOOK_URL != '' }}
        run: |
          curl -sf -X POST "${{ vars.SYNC_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}"
