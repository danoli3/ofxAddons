name: Crawl addons

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: ofxaddons-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Crawl Github for addons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php crawl.php

      # ~4MB of JSON gzips down to ~400KB - the .gz is what
      # ofx_fetch_latest_crawl_snapshot() on the site actually fetches;
      # the plain .json stays published too so it's still readable
      # directly in a browser.
      - name: Compress the snapshot
        run: gzip -k9 data/addons.json

      - name: Publish a dated release with the snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="data-$(date -u +%Y-%m-%d)"
          notes="Automated crawl - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" data/addons.json data/addons.json.gz --clobber
          else
            gh release create "$tag" data/addons.json data/addons.json.gz \
              --title "Addon data $(date -u +%Y-%m-%d)" \
              --notes "$notes" \
              --target main
          fi

      # /releases/latest always resolves to the most recent non-prerelease
      # release, so the site can always fetch
      # /releases/latest/download/addons.json without knowing today's tag.
      - name: Notify the site to sync
        if: ${{ vars.SYNC_WEBHOOK_URL != '' }}
        run: |
          curl -sf -X POST "${{ vars.SYNC_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}"
